[project]
name = "backend"
version = "0.1.0"
description = ""
readme = "NOTES.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "fastapi[standard]==0.115.12",
    "starlette==0.46.2",
    "uvicorn==0.35.0",
    "motor==3.7.1",
    "pydantic==2.11.4",
    "pydantic-core==2.33.2",
    "pydantic-settings==2.9.1",
    "pyjwt==2.10.1",
    "jmespath==1.0.1",
    "cryptography==45.0.2",
    "loguru==0.7.3",
    "pytest==8.3.5",
    "vnoise==0.1.0",
]

[dependency-groups]
test = [
    "bcrypt>=4.2.0",
    "httpx>=0.27.2",
    "pyjwt[crypto]>=2.9.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov",
    "pytest-sugar",
    "pytest-testmon",
    "pytest>=6.0",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -s"
testpaths = [
    "tests",
]
asyncio_default_fixture_loop_scope = "function"
