[project]
name = "utm-observer"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "backend",
]

[tool.uv.workspace]
members = [
    "backend",
]

[tool.uv.sources]
backend = { workspace = true }

[dependency-groups]
test = [
    "bcrypt>=4.2.0",
    "httpx>=0.27.2",
    "pyjwt[crypto]>=2.9.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov",
    "pytest-sugar",
    "pytest-testmon",
    "pytest>=6.0",
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q -s"
testpaths = [
    "tests",
]
asyncio_default_fixture_loop_scope = "function"
